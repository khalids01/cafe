name: Publish Docker images

on:
  push:
    branches: [main, ecommerce]
  workflow_dispatch:

permissions:
  contents: read

# Avoid overlapping publication of the same shop's moving tag.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: khalids01/ecommerce-shops

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip docker]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate public build configuration
        env:
          BRAND: ${{ vars.BRAND }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          case "$GITHUB_REF_NAME" in main|ecommerce) ;; *) echo 'Select main or ecommerce for publication'; exit 1 ;; esac
          case "$BRAND" in foodshop|bestsky|airshop) ;; *) echo 'Set repository variable BRAND'; exit 1 ;; esac
          test -n "$VITE_SERVER_URL" || { echo 'Set repository variable VITE_SERVER_URL'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: khalids01
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:api-${{ vars.BRAND }}-sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:web-${{ vars.BRAND }}-sha-${{ github.sha }}
          build-args: |
            BRAND=${{ vars.BRAND }}
            VITE_SERVER_URL=${{ vars.VITE_SERVER_URL }}
            VITE_ENABLE_POLAR=${{ vars.VITE_ENABLE_POLAR || 'false' }}
            VITE_OWNER_SETUP_CHECK=${{ vars.VITE_OWNER_SETUP_CHECK || 'false' }}
            AUTH_SESSION_COOKIE_NAME=${{ vars.AUTH_SESSION_COOKIE_NAME || 'better-auth.session_token' }}
          cache-from: type=gha,scope=web-${{ vars.BRAND }}
          cache-to: type=gha,mode=max,scope=web-${{ vars.BRAND }}
      - name: Publish deployment pointers after both builds succeed
        env:
          BRAND: ${{ vars.BRAND }}
        run: |
          for service in web api; do
            docker buildx imagetools create \
              --tag "$IMAGE_REPOSITORY:$service-$BRAND-$GITHUB_REF_NAME" \
              "$IMAGE_REPOSITORY:$service-$BRAND-sha-$GITHUB_SHA"
          done
          echo "IMAGE_TAG=sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Both images published. Deploy this tag in Dokploy, or use IMAGE_TAG=$GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy published ecommerce images in Dokploy
        if: github.ref == 'refs/heads/ecommerce'
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const { DOKPLOY_URL: base, DOKPLOY_COMPOSE_ID: composeId, DOKPLOY_API_KEY: key } = process.env;
          if (!base && !composeId && !key) {
            console.log('Dokploy deployment is not configured; images published successfully.');
            process.exit(0);
          }
          if (!base || !composeId || !key) throw new Error('Set DOKPLOY_URL, DOKPLOY_COMPOSE_ID and DOKPLOY_API_KEY');
          const origin = new URL(base);
          if (origin.protocol !== 'https:' || origin.username || origin.password || origin.search || origin.hash) throw new Error('DOKPLOY_URL must be an HTTPS origin');
          const response = await fetch(new URL('/api/compose.deploy', origin), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': key },
            body: JSON.stringify({ composeId }),
            signal: AbortSignal.timeout(30000),
            redirect: 'error',
          });
          if (!response.ok) throw new Error(`Dokploy rejected deployment: HTTP ${response.status}`);
          console.log('Dokploy accepted deployment. Check its deployment logs for migration and application health.');
          JS
